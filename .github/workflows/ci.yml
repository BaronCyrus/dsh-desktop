name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test
      - name: Build application
        run: ARCHITECTURES="$(uname -m)" make build
      - name: Verify application
        run: make verify
